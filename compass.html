<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>罗盘</title>
    <link rel="stylesheet" href="/css/compass.css">
</head>
<body>

    <div class="header">
        <div class="degree" id="deg-out">0°</div>
    </div>

    <div class="compass-area">
        <div class="viewport" id="touch-zone">
            <div class="pointer"></div>
            <div id="disk">
                <div class="taiji" id="authBtn">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="48" fill="none" stroke="currentColor" stroke-width="2"/>
                        <path d="M 50 2 A 24 24 0 0 1 50 50 A 24 24 0 0 0 50 98 A 48 48 0 0 1 50 2" fill="currentColor"/>
                        <circle cx="50" cy="26" r="6" fill="var(--bg)"/>
                        <circle cx="50" cy="74" r="6" fill="currentColor"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/compass.js"></script>
</body>
</html>
